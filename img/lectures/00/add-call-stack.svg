  <rect width="100%" height="100%" fill="white"/><text x="600" y="48" class="title" text-anchor="middle">Кадр вызова метода Add</text><rect x="70" y="80" width="1060" height="555" rx="16" class="panel"/><text x="600" y="123" class="panel-title" text-anchor="middle">Стек</text><rect x="120" y="150" width="960" height="185" rx="10" class="box"/><text x="138" y="180" class="object-title" text-anchor="start">Add(2, 3) — текущий кадр</text><text x="138" y="215" class="name" text-anchor="start">left</text><rect x="138" y="225" width="300" height="64" rx="0" class="box"/><line x1="243" y1="225" x2="243" y2="289" class="divider"/><text x="190.5" y="264" class="type" text-anchor="middle">int</text><text x="340.5" y="265" class="value" text-anchor="middle">2</text><text x="450" y="215" class="name" text-anchor="start">right</text><rect x="450" y="225" width="300" height="64" rx="0" class="box"/><line x1="555" y1="225" x2="555" y2="289" class="divider"/><text x="502.5" y="264" class="type" text-anchor="middle">int</text><text x="652.5" y="265" class="value" text-anchor="middle">3</text><text x="762" y="215" class="name" text-anchor="start">result</text><rect x="762" y="225" width="300" height="64" rx="0" class="box"/><line x1="867" y1="225" x2="867" y2="289" class="divider"/><text x="814.5" y="264" class="type" text-anchor="middle">int</text><text x="964.5" y="265" class="value" text-anchor="middle">5</text><rect x="120" y="380" width="960" height="150" rx="10" class="box"/><text x="138" y="410" class="object-title" text-anchor="start">Main</text><text x="138" y="445" class="name" text-anchor="start">answer</text><rect x="138" y="455" width="924" height="64" rx="0" class="box"/><line x1="243" y1="455" x2="243" y2="519" class="divider"/><text x="190.5" y="494" class="type" text-anchor="middle">int</text><text x="652.5" y="495" class="value" text-anchor="middle">—</text><path d="M600 340 L600 370" class="arrow" marker-end="url(#arrow)"/><text x="600" y="585" class="small" text-anchor="middle">До return значение answer ещё не присвоено; затем кадр Add снимается и answer получает 5.</text></svg>