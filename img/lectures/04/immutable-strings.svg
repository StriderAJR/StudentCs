<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="540" viewBox="0 0 1150 540"><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:35px;font-weight:700;fill:#1457c5}.label{font-size:23px;font-weight:700}.small{font-size:20px}.box{fill:#fff;stroke:#222;stroke-width:3}</style><text x="575" y="50" text-anchor="middle" class="title">Строки неизменяемы: Replace создаёт новый объект</text><rect x="50" y="85" width="1050" height="390" rx="16" class="box"/><text x="130" y="145" class="label">message</text><rect x="100" y="165" width="350" height="70" class="box"/><text x="275" y="210" text-anchor="middle" class="small">"Server: Aurora"</text><text x="535" y="208" class="title">Replace</text><text x="760" y="145" class="label">shortMessage</text><rect x="700" y="165" width="320" height="70" class="box"/><text x="860" y="210" text-anchor="middle" class="small">"S: Aurora"</text><path d="M455 200h225" stroke="#1457c5" stroke-width="5" marker-end="url(#a)"/><text x="575" y="300" text-anchor="middle" class="small">Старая строка не меняется; новая строка получает отдельный объект.</text><text x="575" y="350" text-anchor="middle" class="small">Переменные содержат разные ссылки.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#1457c5"/></marker></defs></svg>
